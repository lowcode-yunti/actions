# 前端镜像用的 nginx 站点配置（conf.d/default.conf）。
#
# 与 FastapiAdmin/docker/nginx/nginx.conf 的关系：只保留「提供一个前端站点」必需的
# 部分，其余（443/TLS、docs/app 两个站点、限流）都不带：
#   - 不监听 443、不内置证书：TLS 由入口（SLB / 网关 / 外层 nginx）终止；
#   - 不代理 docs / app：源仓库这两个目录没有开源，镜像里也没有对应产物。
#
# 路径约定：前端用 VITE_BASE_URL=/web 构建，dist 里的资源引用是 /web/js/xxx.js。
# 所以站点根是 /usr/share/nginx/html，前端内容放在 /web 子目录下，**不能**把 root
# 直接指到 web 目录（那样 /web/js/... 会被解析成 web/web/js/... 而 404）。

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/x-javascript
        image/svg+xml
        image/x-icon;

    # 健康检查：不依赖磁盘上的静态文件，入口探活用这个
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 直接访问容器端口时给个落脚点；外部入口一般直接把 /web/ 挂出去
    location = / {
        return 302 /web/;
    }

    # 带 hash 的静态资源长缓存。只按扩展名匹配，index.html 不在列表里，
    # 因此入口 HTML 仍走下面的 location /web/ 拿 no-store。
    location ~* ^/web/.+\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        # 只用 add_header，不叠加 expires：两者一起会输出两条 Cache-Control
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA 回退：刷新 /web 下的子路由不能 404
    location /web/ {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /web/index.html;
    }

    # 漏写末尾斜杠时补一个，否则 /web-xxx 这类路径会和别名拼接错位
    location = /web {
        return 301 /web/;
    }

    # 后端 API 反向代理（含 WebSocket：AI 对话与若干 SSE 流走这里）
    #
    # backend 的地址必须放进变量、并在 location 里用 resolver：
    #   `proxy_pass http://backend:8001;` 是**启动期**解析，后端未就绪或容器单独
    #   启动（只想看前端页面）时 nginx 会以 `host not found in upstream` 直接退出，
    #   表现为镜像起来就崩。写变量后解析推迟到请求期，启动不受影响。
    # 127.0.0.11 是 Docker 内置 DNS（compose 网络内可用）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "backend:8001";

    location /api/v1 {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-NginX-Proxy true;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_pass http://$backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 不对外暴露 . 开头的隐藏路径
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
