name: yimu-DEV-backend-tiga-case-cython

on:
  workflow_dispatch:
    inputs:
      platform:
        description: '构建平台'
        required: true
        type: choice
        options:
          - x86
          - arm
        default: x86

env:
  DOCKER_IMAGE: cloudladder_public/tiga-case
  REPOSITORY: 'lowcode-yunti/tiga-case'
  BRANCH_NAME: yimu-dev
  DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY_SHANGHAI }}
  DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}

jobs:
  build-and-push:
    runs-on: ${{ github.event.inputs.platform == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ env.BRANCH_NAME }}
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Resolve platform
        id: plat
        run: |
          if [ "${{ github.event.inputs.platform }}" = "arm" ]; then
            echo "docker_platform=linux/arm64" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=-arm" >> "$GITHUB_OUTPUT"
            echo "cache_scope=tiga-be-cython-arm64" >> "$GITHUB_OUTPUT"
          else
            echo "docker_platform=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "tag_suffix=" >> "$GITHUB_OUTPUT"
            echo "cache_scope=tiga-be-cython-amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Get the latest commit SHA of the repository
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get current date
        id: current-date
        run: echo "date=$(TZ=Asia/Shanghai date +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.cython
          platforms: ${{ steps.plat.outputs.docker_platform }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ steps.plat.outputs.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ steps.plat.outputs.cache_scope }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}-backend:${{ env.BRANCH_NAME }}${{ steps.plat.outputs.tag_suffix }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}-backend:${{ env.BRANCH_NAME }}${{ steps.plat.outputs.tag_suffix }}-${{ steps.current-date.outputs.date }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}-backend:${{ steps.get-sha.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
