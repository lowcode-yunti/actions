# 密钥扫描（gitleaks），只扫「本次推送 / 本次 PR 的变更范围」。
#
# 来源：FastapiAdmin/.github/workflows/secrets.yml。改动点：
#   - 触发方式改成 workflow_dispatch + ref 输入（本仓库没有该项目的源码，
#     push/pull_request 的路径与分支过滤在这里没有意义）；
#   - 扫描的是 **actions 仓库本身**（本仓库的历史与变更），不再扫 FastapiAdmin。
#
# 为什么这样有意义：这个 workflow 的职责是「拦住新增的密钥进入本仓库」。
# 要扫描 FastapiAdmin 的新增密钥，需要在那边的仓库里放同样的 workflow；
# 这里的价值是防止本仓库（存着所有部署凭据的引用与 workflow）被塞进明文密钥。

name: mcp-gateway-secrets

on:
  workflow_dispatch:
    inputs:
      scan_all:
        description: "扫全历史（默认只扫当前分支最近一次变更范围）"
        type: boolean
        default: false

jobs:
  gitleaks:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 需要完整历史才能按提交范围扫描

      - name: 安装 gitleaks（固定版本 + 校验和）
        run: |
          set -euo pipefail
          VER=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: 扫描本次变更范围
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.scan_all }}" = "true" ]; then
            RANGE=""
          else
            RANGE="${GITHUB_SHA}~1..${GITHUB_SHA}"
            # 单提交仓库（或首次推送）没有父提交，退化成只检测工作树
            git rev-parse "${GITHUB_SHA}~1" >/dev/null 2>&1 || RANGE="-1"
          fi

          if [ -n "${RANGE}" ] && [ "${RANGE}" != "-1" ]; then
            echo "扫描范围: ${RANGE}"
            gitleaks detect --source . --redact --verbose --log-opts="${RANGE}" --exit-code 1
          else
            echo "扫描范围: 全部历史 / 工作树"
            gitleaks detect --source . --redact --verbose --exit-code 1
          fi
