# 前端 CI：类型检查 + 单元测试（web），类型检查（app）。
#
# 来源：FastapiAdmin/.github/workflows/frontend-ci.yml。改动点：
#   - 触发方式改成 workflow_dispatch + ref 输入，源码用 actions/checkout 拉取；
#   - 依赖在**仓库根**安装：根目录有 pnpm-workspace.yaml + pnpm-lock.yaml，
#     在 frontend/web 里单独 `pnpm install` 走的不是 workspace 的锁文件。
#   - `pnpm run test` 依赖 backend/sql/sys_menu.json（route-invariants 用例按
#     process.cwd() 向上找仓库数据文件），所以 checkout 必须是完整仓库，
#     不能只 sparse-checkout frontend/。
#
# ⚠️ 当前 type-check 是红的，别当成回归
#   feat/code-protection 上本地实测（2026-11-02）：frontend/web 的 `vue-tsc --noEmit`
#   报 118 个 TS error（源仓库里也是 78~118 个，取决于 node_modules 版本），
#   `pnpm run test` 是绿的（62 passed）。所以 type-check 先 continue-on-error，
#   test 保持硬门禁。

name: mcp-gateway-frontend-ci

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "源码分支（留空用 env.BRANCH_NAME）"
        type: string
        default: ""

env:
  REPOSITORY: 'lowcode-yunti/mcp_gateway'
  BRANCH_NAME: feat/code-protection

jobs:
  web:
    name: web（类型检查 + 单元测试）
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ github.event.inputs.ref || env.BRANCH_NAME }}
          token: ${{ secrets.ACTION_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # src/types/{auto-imports,components}.d.ts 由 unplugin-* 在 vite 运行时生成，
      # 仓库按惯例不跟踪，干净检出下直接 vue-tsc 会报大量 TS2304（ref/h/onMounted…），
      # 因此必须先跑一次构建生成这些声明，再执行类型检查。
      - name: 生产构建（生成自动导入声明）
        working-directory: frontend/web
        env:
          VITE_BASE_URL: /web
          VITE_APP_BASE_API: /api/v1
        run: pnpm run build:prod

      - name: 类型检查
        working-directory: frontend/web
        continue-on-error: true
        run: pnpm run type-check

      - name: 单元测试
        working-directory: frontend/web
        run: pnpm run test

  app:
    name: app（类型检查）
    runs-on: ubuntu-latest
    steps:
      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPOSITORY }}
          ref: ${{ github.event.inputs.ref || env.BRANCH_NAME }}
          token: ${{ secrets.ACTION_TOKEN }}

      # frontend/app 不在根 workspace 里（pnpm-workspace.yaml 只含 frontend/web），
      # 有自己的 packageManager 声明，所以用 pnpm/action-setup 不带 version，
      # 让 action 读 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
          cache-dependency-path: frontend/app/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: frontend/app
        # 源仓库用的是 pnpm-lock.yaml（1 个），--frozen-lockfile 保证 CI 不漂移
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        working-directory: frontend/app
        continue-on-error: true
        run: pnpm run type-check
